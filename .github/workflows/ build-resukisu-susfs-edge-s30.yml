name: Build ver2 ReSukiSU+SUSFS boot.img (xpeng) - Enhanced

"on":
  workflow_dispatch:
    inputs:
      update_resukisu:
        description: "Update ReSukiSU submodule to latest main"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-resukisu-susfs-enhanced
  cancel-in-progress: true

env:
  KERNEL_REPO: https://github.com/LuoJuly/android_kernel_motorola_sm7325.git
  KERNEL_BRANCH: lineage-23.2-SUSFS

jobs:
  build:
    name: Build & Release (Edge S30 + SUSFS + Enhanced)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex bc libssl-dev libelf-dev cpio zip \
            python3 curl ca-certificates git rsync xz-utils

      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Clone kernel source (SUSFS branch)
        run: |
          rm -rf kernel
          git clone --recursive --branch "${KERNEL_BRANCH}" "${KERNEL_REPO}" kernel
          git -C kernel/KernelSU fetch --unshallow origin 2>/dev/null || true

      - name: Add enhanced features to defconfig
        run: |
          DEFCONFIG="kernel/arch/arm64/configs/vendor/lineage_xpeng.config"

          cat >> "$DEFCONFIG" << 'EOF'

          # === Enhanced features ===
          # I/O schedulers
          CONFIG_IOSCHED_BFQ=y
          CONFIG_BFQ_GROUP_IOSCHED=y
          CONFIG_MQ_IOSCHED_DEADLINE=y
          CONFIG_MQ_IOSCHED_KYBER=y

          # Memory
          CONFIG_KSM=y

          # Filesystem
          CONFIG_EXFAT_FS=y

          # Compression
          CONFIG_CRYPTO_LZ4HC=y

          # Disable DEBUG_INFO (smaller kernel, faster build)
          # CONFIG_DEBUG_INFO_DWARF4 is not set
          CONFIG_DEBUG_INFO_NONE=y
          # CONFIG_DEBUG_INFO_BTF is not set
          EOF

          sed -i 's/^[[:space:]]*//' "$DEFCONFIG"

          echo "=== Final defconfig features ==="
          grep -E "CONFIG_KSU|CONFIG_SUSFS|CONFIG_TCP_CONG|CONFIG_IOSCHED|CONFIG_BFQ|CONFIG_MQ_IOSCHED|CONFIG_KSM|CONFIG_EXFAT|CONFIG_CRYPTO_LZ4|CONFIG_WIREGUARD|CONFIG_ZRAM|CONFIG_DEBUG_INFO|CONFIG_BRUTAL" "$DEFCONFIG"

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: kernel/.ci-toolchain
          key: toolchain-clang-r563880c-magisk
          restore-keys: |
            toolchain-clang-r563880c-

      - name: Build kernel, boot.img and AnyKernel3
        id: build
        working-directory: kernel
        env:
          DEVICE: xpeng
          CLANG_VERSION: clang-r563880c
          UPDATE_RESUKISU: ${{ inputs.update_resukisu }}
          KERNEL_URL: https://github.com/LuoJuly/android_kernel_motorola_sm7325.git
          KERNEL_BRANCH: lineage-23.2-SUSFS
        run: |
          mkdir -p scripts/ci
          cp -f "${GITHUB_WORKSPACE}/scripts/ci/"*.sh scripts/ci/
          chmod +x scripts/ci/*.sh
          scripts/ci/build_resukisu_boot.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xpeng-EdgeS30-ReSukiSU-SUSFS-Enhanced-${{ env.LOS_DATE }}
          path: |
            kernel/.ci-work/release/*.img
            kernel/.ci-work/release/*.zip
            kernel/.ci-work/release/Image
            kernel/.ci-work/release/kernel
            kernel/.ci-work/release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: kernel/.ci-work/release/RELEASE_NOTES.md
          files: |
            kernel/.ci-work/release/boot-*.img
            kernel/.ci-work/release/AnyKernel3-*.zip
            kernel/.ci-work/release/Image
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: xpeng ReSukiSU+SUSFS for Moto Edge S30 (XT2175-2)

on:
  workflow_dispatch:
    inputs:
      update_resukisu:
        description: "Update ReSukiSU submodule to latest main"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-resukisu-susfs-edge-s30
  cancel-in-progress: true

jobs:
  build:
    name: Build Edge S30 (ReSukiSU+SUSFS)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex bc libssl-dev libelf-dev cpio \
            python3 curl ca-certificates git rsync xz-utils zip

      - name: Checkout build scripts (LuoJuly)
        uses: actions/checkout@v4
        with:
          repository: LuoJuly/android_kernel_motorola_xpeng_build
          ref: S3RXC32.33-8-29-ReSukiSU
          fetch-depth: 0

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .ci-toolchain
          key: toolchain-clang-r383902b1-lineage-gcc49-magisk-v2
          restore-keys: |
            toolchain-clang-r383902b1-lineage-gcc49-

      - name: Build kernel with SUSFS
        id: build
        env:
          VARIANT: edge-s30
          ENABLE_NFC: "false"
          UPDATE_RESUKISU: ${{ inputs.update_resukisu }}
          KERNEL_URL: https://github.com/LuoJuly/android_kernel_motorola_xpeng.git
          KERNEL_BRANCH: android-12-release-S3RXC32.33-8-29
          CLANG_GIT_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          GCC_GIT_URL: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git
          GCC_GIT_BRANCH: lineage-19.1
          GCC_GIT_FALLBACK: https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          GCC_GIT_FALLBACK_BRANCH: master-kernel-build-2021
        run: |
          chmod +x scripts/ci/build_resukisu_boot.sh scripts/ci/pack_anykernel3.sh
          chmod +x scripts/ci/host-bin/* || true

          # ============================================================
          # 创建 SUSFS 注入脚本
          # ============================================================
          cat > scripts/ci/inject_susfs.sh << 'INJECT_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          KERNEL_DIR="${1:?Usage: inject_susfs.sh <kernel_dir>}"
          echo "[+] Injecting SUSFS into ${KERNEL_DIR}"

          # 1. 获取 SUSFS 源文件（从小米 SM8350 仓库，已验证兼容 5.4/Lahaina）
          SUSFS_SRC="/tmp/susfs-source"
          if [ ! -d "$SUSFS_SRC" ]; then
            git clone --depth=1 https://github.com/renoir-cememer-test/android_kernel_xiaomi_sm8350.git "$SUSFS_SRC"
          fi

          # 2. 复制 SUSFS 源文件到内核树
          cp -f "$SUSFS_SRC/fs/susfs.c" "$KERNEL_DIR/fs/susfs.c"
          cp -f "$SUSFS_SRC/include/linux/susfs.h" "$KERNEL_DIR/include/linux/susfs.h"
          cp -f "$SUSFS_SRC/include/linux/susfs_def.h" "$KERNEL_DIR/include/linux/susfs_def.h"
          echo "[+] SUSFS source files copied"

          # 3. 修改 fs/Makefile 添加编译入口
          if ! grep -q "susfs" "$KERNEL_DIR/fs/Makefile"; then
            sed -i '/fs_types.o fs_context.o fs_parser.o fsopen.o/a\\nobj-$(CONFIG_KSU_SUSFS) += susfs.o' "$KERNEL_DIR/fs/Makefile"
            echo "[+] fs/Makefile updated"
          else
            echo "[+] fs/Makefile already has susfs entry"
          fi

          # 4. 修改 defconfig：去掉 MANUAL_HOOK（与 SUSFS 互斥），确保 SUSFS 配置
          DEFCONFIG="$KERNEL_DIR/arch/arm64/configs/vendor/ext_config/moto-lahaina-xpeng.config"
          if [ -f "$DEFCONFIG" ]; then
            sed -i '/CONFIG_KSU_MANUAL_HOOK/d' "$DEFCONFIG"
            if ! grep -q "CONFIG_KSU_SUSFS=y" "$DEFCONFIG"; then
              cat >> "$DEFCONFIG" << 'SUSFS_CFG'

          # SUSFS (Root hiding)
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y

          # I/O schedulers
          CONFIG_IOSCHED_BFQ=y
          CONFIG_BFQ_GROUP_IOSCHED=y
          CONFIG_MQ_IOSCHED_DEADLINE=y
          CONFIG_MQ_IOSCHED_KYBER=y

          # Network
          CONFIG_TCP_CONG_BBR=y

          # Memory
          CONFIG_KSM=y

          # Filesystem
          CONFIG_EXFAT_FS=y

          # Compression
          CONFIG_CRYPTO_LZ4HC=y
          SUSFS_CFG
              echo "[+] SUSFS + extra features config added"
            else
              echo "[+] SUSFS config already present"
            fi
          else
            echo "[!] WARNING: defconfig not found at $DEFCONFIG"
          fi

          # 5. 验证
          if [ -f "$KERNEL_DIR/fs/susfs.c" ]; then
            echo "[+] VERIFIED: fs/susfs.c exists"
            grep "SUSFS_VERSION" "$KERNEL_DIR/include/linux/susfs.h" | head -1
          else
            echo "[!] ERROR: fs/susfs.c missing!"
            exit 1
          fi
          echo "[+] SUSFS injection complete"
          INJECT_EOF
          chmod +x scripts/ci/inject_susfs.sh

          # ============================================================
          # 修改构建脚本：在 fetch_kernel 之后注入 SUSFS
          # ============================================================
          # 在 build_resukisu_boot.sh 的 main() 函数中，fetch_kernel 后插入 inject_susfs 调用
          sed -i 's/^  fetch_kernel$/  fetch_kernel\n  inject_susfs/' scripts/ci/build_resukisu_boot.sh

          # 在脚本末尾（main 调用之前）添加 inject_susfs 函数定义
          sed -i '/^main "\$@"$/i\
          inject_susfs() {\
            log "Inject SUSFS into kernel source"\
            bash "${BUILD_ROOT}/scripts/ci/inject_susfs.sh" "${KERNEL_DIR}"\
            endlog\
          }\
          ' scripts/ci/build_resukisu_boot.sh

          # 运行构建
          scripts/ci/build_resukisu_boot.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xpeng-EdgeS30-ReSukiSU-SUSFS
          path: |
            .ci-work/edge-s30/release/boot_ksu.img
            .ci-work/edge-s30/release/boot.img
            .ci-work/edge-s30/release/Image
            .ci-work/edge-s30/release/AnyKernel3*.zip
            .ci-work/edge-s30/release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30
